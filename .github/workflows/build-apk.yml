name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate Debug Keystore in Correct Path
        run: |
          PROJECT_ROOT=$(find . -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "Project root found at: $PROJECT_ROOT"
          
          mkdir -p "$PROJECT_ROOT/app"
          $JAVA_HOME/bin/keytool -genkey -v -keystore "$PROJECT_ROOT/app/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          
          echo "Verifying keystore location:"
          ls -la "$PROJECT_ROOT/app/debug.keystore"

      - name: Build Debug APK
        run: |
          gradle wrapper
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Matoshree-APK
          path: '**/build/outputs/apk/debug/*.apk'
