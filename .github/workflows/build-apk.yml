name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Project Root
        run: |
          PROJECT_ROOT=$(find . -name "build.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="."
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Found Android project at: $PROJECT_ROOT"

      - name: Setup Debug Keystore
        run: |
          mkdir -p "$PROJECT_ROOT/app"
          if [ -f "$PROJECT_ROOT/debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64 (preserves Firebase SHA-1)..."
            base64 -d "$PROJECT_ROOT/debug.keystore.base64" > "$PROJECT_ROOT/debug.keystore"
          elif [ ! -f "$PROJECT_ROOT/debug.keystore" ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v \
              -keystore "$PROJECT_ROOT/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          # Ensure keystore exists at both root (where build.gradle.kts looks) and app/
          cp -f "$PROJECT_ROOT/debug.keystore" "$PROJECT_ROOT/app/debug.keystore" 2>/dev/null || true

      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Matoshree-APK
          path: '**/build/outputs/apk/debug/*.apk'
